<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<title>X4G Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#070b14; --panel:#0e1422; --panel-hi:#131b2e; --line:#1c253c;
    --text:#e9edf7; --muted:#7c88a8;
    --blue:#4f7cff; --teal:#21d0ac; --violet:#a463f7; --amber:#f5a623; --red:#f0455c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); overscroll-behavior:none;}
  body{font-family:'Vazirmatn',sans-serif; color:var(--text);}
  #root{height:100vh; height:100dvh; width:100%; overflow:hidden;}
  ::-webkit-scrollbar{display:none;}
  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; -webkit-user-select:none; user-select:none;}
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .disp{font-family:'Space Grotesk',sans-serif;}

  .col{display:flex; flex-direction:column;}
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .center{align-items:center; justify-content:center;}
  .gap2{gap:8px;} .gap3{gap:12px;} .gap4{gap:16px;}
  .flex1{flex:1; min-width:0;}
  .relative{position:relative;} .absolute{position:absolute;}
  .truncate{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px;}
  .btn-primary{background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff; border-radius:14px; padding:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .15s; touch-action:manipulation;}
  .btn-primary:active{transform:scale(.97);}
  .btn-primary:disabled{opacity:.5;}
  .btn-ghost{border:1px solid var(--line); color:var(--muted); border-radius:14px; padding:12px 22px; display:flex; align-items:center; gap:8px; touch-action:manipulation;}
  .input{width:100%; background:var(--panel-hi); border:1px solid var(--line); border-radius:10px; padding:11px 12px; color:var(--text); font-size:13.5px; outline:none;}
  .badge{font-size:10px; border-radius:6px; padding:1px 6px; border:1px solid currentColor;}

  .toggle{position:relative; width:42px; height:24px; border-radius:99px; transition:background .2s; flex-shrink:0; touch-action:manipulation;}
  .toggle-knob{position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:99px; background:#fff; transition:transform .2s;}

  .progress-track{width:100%; height:6px; border-radius:99px; background:var(--line); overflow:hidden;}
  .progress-fill{height:100%; border-radius:99px; transition:width .6s ease;}

  .tab-bar{border-top:1px solid var(--line); background:var(--panel); display:flex; align-items:center; justify-content:space-around; padding:8px; flex-shrink:0; padding-bottom:calc(8px + env(safe-area-inset-bottom));}
  .tab-item{display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 14px; border-radius:12px; color:var(--muted); touch-action:manipulation;}
  .tab-item.active{color:var(--blue); background:rgba(79,124,255,.08);}
  .tab-item span{font-size:10.5px;}

  .fab{position:fixed; width:56px; height:56px; border-radius:99px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--blue),var(--violet)); box-shadow:0 8px 24px rgba(79,124,255,.4); bottom:92px; left:20px; transition:transform .15s; touch-action:manipulation;}
  .fab:active{transform:scale(.9);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal-sheet{width:100%; max-width:420px; max-height:85vh; overflow-y:auto; background:var(--panel); border-top:1px solid var(--line); border-radius:24px 24px 0 0; padding:20px; display:flex; flex-direction:column; gap:14px; animation:slideUp .25s ease both;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; border-radius:12px; padding:10px 16px; display:flex; align-items:center; gap:8px; font-size:12.5px; border:1px solid var(--line); z-index:60; animation:rise .25s ease both;}

  .blob{position:absolute; border-radius:99px; filter:blur(90px); pointer-events:none;}

  @keyframes ping{0%{transform:scale(.7); opacity:.7;} 100%{transform:scale(1.35); opacity:0;}}
  @keyframes float{0%,100%{transform:translate(0,0);} 50%{transform:translate(10px,20px);}}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.3;}}
  @keyframes slideUp{from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 1s linear infinite;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

/* ---------- tiny inline icon set (feather-style, stroke based) ---------- */
function Icon({ name, size = 18, color = "currentColor", spin = false }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className: spin ? "spin" : "" };
  const paths = {
    shield: <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" />,
    link: <><path d="M9 15l6-6" /><path d="M13 5l1-1a4 4 0 015.5 5.5l-2 2" /><path d="M11 19l-1 1A4 4 0 014.5 14.5l2-2" /></>,
    radio: <><circle cx="12" cy="12" r="2.5" /><path d="M6.5 6.5a8 8 0 000 11" /><path d="M17.5 6.5a8 8 0 010 11" /><path d="M4 4a12 12 0 000 16" /><path d="M20 4a12 12 0 010 16" /></>,
    settings: <><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z" /></>,
    logout: <><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" /></>,
    plus: <><path d="M12 5v14" /><path d="M5 12h14" /></>,
    x: <><path d="M18 6L6 18" /><path d="M6 6l12 12" /></>,
    copy: <><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 012-2h10" /></>,
    check: <path d="M20 6L9 17l-5-5" />,
    trash: <><path d="M3 6h18" /><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" /></>,
    refresh: <><path d="M21 2v6h-6" /><path d="M3 22v-6h6" /><path d="M3.5 9a9 9 0 0115-3.5L21 8" /><path d="M20.5 15a9 9 0 01-15 3.5L3 16" /></>,
    chevron: <path d="M15 18l-6-6 6-6" />,
    alert: <><path d="M12 9v4" /><path d="M12 17h.01" /><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" /></>,
    wifi: <><path d="M5 12.5a11 11 0 0114 0" /><path d="M8.5 16a6 6 0 017 0" /><path d="M12 19.5h.01" /></>,
    activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
    gauge: <><path d="M12 21a9 9 0 100-18 9 9 0 000 18z" /><path d="M12 12l4-4" /><path d="M12 7v.01" /></>,
    clock: <><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></>,
    qrcode: <><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><path d="M14 14h3v3h-3z" /><path d="M20 14h1v1h-1z" /><path d="M14 20h1v1h-1z" /><path d="M20 20h1v1h-1z" /></>,
    loader: <><circle cx="12" cy="12" r="9" opacity=".25" /><path d="M21 12a9 9 0 00-9-9" /></>,
    eye: <><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" /></>,
    eyeOff: <><path d="M17.9 17.9A10.9 10.9 0 0112 19c-7 0-11-7-11-7a19.4 19.4 0 015.1-5.7M9.9 4.2A10.4 10.4 0 0112 4c7 0 11 7 11 7a19.5 19.5 0 01-3.2 4.1" /><path d="M14.1 14.1a3 3 0 11-4.2-4.2" /><path d="M1 1l22 22" /></>,
    dashboard: <><rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" /><rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" /></>,
  };
  return <svg {...common}>{paths[name]}</svg>;
}

/* ---------- helpers ---------- */
const FA_DIGITS = { 0:"۰",1:"۱",2:"۲",3:"۳",4:"۴",5:"۵",6:"۶",7:"۷",8:"۸",9:"۹" };
const fa = (v) => String(v).replace(/[0-9]/g, d => FA_DIGITS[d]);
function fmtBytes(b) {
  if (!b) return "0 B";
  if (b < 1024) return `${b} B`;
  if (b < 1024**2) return `${(b/1024).toFixed(1)} KB`;
  if (b < 1024**3) return `${(b/1024**2).toFixed(2)} MB`;
  return `${(b/1024**3).toFixed(2)} GB`;
}

const PROTOCOLS = [
  { id: "vless-ws", label: "VLESS / WS" },
  { id: "xhttp-packet-up", label: "XHTTP · Packet Up" },
  { id: "xhttp-stream-up", label: "XHTTP · Stream Up" },
  { id: "xhttp-stream-one", label: "XHTTP · Stream One" },
];
const FINGERPRINTS = ["chrome","firefox","safari","ios","android","edge","360","qq","random","randomized"];
const BASE = window.location.origin; // same-origin: served directly by the X4G backend

function useToast() {
  const [toast, setToast] = useState(null);
  const t = useRef(null);
  const show = useCallback((msg, kind="ok") => {
    setToast({ msg, kind });
    clearTimeout(t.current);
    t.current = setTimeout(() => setToast(null), 2600);
  }, []);
  return [toast, show];
}

async function apiCall(path, opts = {}) {
  let res;
  try {
    res = await fetch(BASE + path, {
      credentials: "include",
      headers: { "Content-Type": "application/json", ...(opts.headers||{}) },
      ...opts,
    });
  } catch {
    throw new Error("اتصال برقرار نشد. اینترنت را بررسی کنید.");
  }
  if (res.status === 401) throw new Error("UNAUTHORIZED");
  if (!res.ok) {
    let msg = `خطای پنل (${res.status})`;
    try { const j = await res.json(); if (j.detail) msg = j.detail; } catch {}
    throw new Error(msg);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res.text();
}

/* ---------- shared bits ---------- */
function Card({ children, style, className="" }) {
  return <div className={`card ${className}`} style={style}>{children}</div>;
}
function Toggle({ checked, onChange, disabled }) {
  return (
    <button className="toggle" disabled={disabled} onClick={() => onChange(!checked)}
      style={{ background: checked ? "var(--teal)" : "var(--line)", opacity: disabled ? .5 : 1 }}>
      <span className="toggle-knob" style={{ transform: checked ? "translateX(18px)" : "translateX(0)" }} />
    </button>
  );
}
function StatTile({ icon, label, value, sub, color }) {
  return (
    <Card className="col gap2">
      <div className="row center" style={{ width:36, height:36, borderRadius:10, background:`${color}1f` }}>
        <Icon name={icon} size={16} color={color} />
      </div>
      <div>
        <div className="disp" style={{ fontSize:22, fontWeight:700 }}>{value}</div>
        <div style={{ fontSize:12, color:"var(--muted)", marginTop:2 }}>{label}</div>
        {sub && <div style={{ fontSize:11, color, marginTop:4 }}>{sub}</div>}
      </div>
    </Card>
  );
}

/* ---------- signature element: live tunnel pulse ---------- */
function TunnelPulse({ active, size = 148 }) {
  const r = size/2 - 14;
  const c = 2*Math.PI*r;
  const pct = Math.min(active, 40)/40;
  return (
    <div className="relative row center" style={{ width:size, height:size }}>
      {[0,1,2].map(i => (
        <span key={i} className="absolute" style={{ width:size, height:size, borderRadius:"50%", border:"1px solid rgba(79,124,255,.35)", animation:"ping 3s cubic-bezier(0,.6,.4,1) infinite", animationDelay:`${i}s` }} />
      ))}
      <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--line)" strokeWidth="6" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="url(#g)" strokeWidth="6" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c - c*Math.max(pct,.04)}
          style={{ transition:"stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)", filter:"drop-shadow(0 0 6px rgba(79,124,255,.65))" }} />
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="var(--teal)" /><stop offset="100%" stopColor="var(--blue)" />
        </linearGradient></defs>
      </svg>
      <div className="absolute col center">
        <span className="disp" style={{ fontSize:34, fontWeight:700, lineHeight:1 }}>{fa(active)}</span>
        <span style={{ fontSize:11, color:"var(--muted)", marginTop:4 }}>اتصال زنده</span>
      </div>
    </div>
  );
}

/* ---------- login ---------- */
function LoginScreen({ onLoggedIn }) {
  const [pw, setPw] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function submit() {
    if (!pw || busy) return;
    setBusy(true); setErr("");
    try {
      await apiCall("/api/login", { method:"POST", body: JSON.stringify({ password: pw }) });
      onLoggedIn();
    } catch (e) {
      setErr(e.message === "UNAUTHORIZED" ? "رمز عبور اشتباه است" : e.message);
    } finally { setBusy(false); }
  }

  return (
    <div className="col center relative" style={{ width:"100%", height:"100%", padding:"0 24px", overflow:"hidden" }}>
      <div className="blob" style={{ width:340, height:340, background:"var(--blue)", opacity:.16, top:-80, left:-80, animation:"float 9s ease-in-out infinite" }} />
      <div className="blob" style={{ width:300, height:300, background:"var(--teal)", opacity:.14, bottom:-60, right:-60, animation:"float 11s ease-in-out infinite reverse" }} />
      <div className="col center" style={{ width:"100%", maxWidth:360, zIndex:1 }}>
        <div className="col center gap2" style={{ marginBottom:32, animation:"rise .6s ease both" }}>
          <div className="row center" style={{ width:64, height:64, borderRadius:18, background:"linear-gradient(135deg,var(--blue),var(--violet))", boxShadow:"0 8px 30px rgba(79,124,255,.35)", marginBottom:8 }}>
            <Icon name="shield" size={28} color="#fff" />
          </div>
          <h1 className="disp" style={{ fontSize:26, fontWeight:700, margin:0 }}>X4G Companion</h1>
          <p style={{ fontSize:13, color:"var(--muted)", margin:0 }}>به پنل مدیریت خودت وصل شو</p>
        </div>

        <div className="col gap3" style={{ width:"100%", animation:"rise .6s .1s ease both" }}>
          <Card style={{ padding:0 }}>
            <div className="relative">
              <input type={showPw?"text":"password"} value={pw} autoFocus dir="ltr"
                onChange={e=>setPw(e.target.value)}
                onKeyDown={e=>{ if(e.key==="Enter") submit(); }}
                placeholder="رمز عبور پنل"
                className="mono" style={{ width:"100%", background:"transparent", border:"none", outline:"none", textAlign:"center", padding:"16px 44px", color:"var(--text)", fontSize:16 }} />
              <button onClick={()=>setShowPw(s=>!s)} className="absolute" style={{ top:"50%", left:14, transform:"translateY(-50%)", color:"var(--muted)" }}>
                <Icon name={showPw?"eyeOff":"eye"} size={18} />
              </button>
            </div>
          </Card>

          {err && <div className="row gap2" style={{ background:"rgba(240,69,92,.1)", color:"var(--red)", borderRadius:12, padding:"10px 12px", fontSize:12.5 }}>
            <Icon name="alert" size={14} /> {err}
          </div>}

          <button className="btn-primary" disabled={busy || !pw} onClick={submit}>
            <Icon name={busy?"loader":"shield"} size={18} spin={busy} /> ورود به داشبورد
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- dashboard ---------- */
function DashboardTab({ stats, links, loading, onRefresh }) {
  const active = stats?.active_connections ?? 0;
  const hourly = stats?.hourly ? Object.entries(stats.hourly) : [];
  const maxH = Math.max(1, ...hourly.map(([,v]) => v));
  return (
    <div className="col gap4" style={{ paddingBottom:16 }}>
      <Card className="col center" style={{ padding:"28px 16px", background:"radial-gradient(circle at 50% 0%, var(--panel-hi), var(--panel))" }}>
        <TunnelPulse active={active} />
        <div className="row gap2" style={{ marginTop:16 }}>
          <span style={{ width:8, height:8, borderRadius:99, background:"var(--teal)", animation:"blink 1.6s ease-in-out infinite" }} />
          <span style={{ fontSize:12.5, color:"var(--muted)" }}>سرویس فعال · آپتایم {fa(stats?.uptime ?? "--:--:--")}</span>
        </div>
      </Card>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        <StatTile icon="activity" label="کل ترافیک" value={`${fa(stats?.total_traffic_mb ?? 0)} MB`} color="var(--blue)" />
        <StatTile icon="link" label="کانفیگ‌های فعال" value={fa(stats?.active_links ?? 0)} sub={`از ${fa(stats?.links_count ?? links.length)} کانفیگ`} color="var(--teal)" />
        <StatTile icon="gauge" label="درخواست‌ها" value={fa(stats?.total_requests ?? 0)} color="var(--violet)" />
        <StatTile icon="alert" label="خطاها" value={fa(stats?.total_errors ?? 0)} color={stats?.total_errors ? "var(--red)" : "var(--muted)"} />
      </div>

      {hourly.length > 0 && (
        <Card>
          <div className="row between" style={{ marginBottom:10 }}>
            <span style={{ fontSize:13, fontWeight:600 }}>ترافیک ساعتی</span>
            <Icon name="clock" size={14} color="var(--muted)" />
          </div>
          <div className="row gap2" style={{ alignItems:"flex-end", height:90 }}>
            {hourly.map(([h,v]) => (
              <div key={h} className="col center gap2" style={{ flex:1 }}>
                <div style={{ width:"100%", maxWidth:18, height:Math.max(4,(v/maxH)*64), borderRadius:4, background:"linear-gradient(180deg,var(--teal),var(--blue))" }} />
                <span style={{ fontSize:9, color:"var(--muted)" }}>{h.slice(0,2)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      <button className="btn-ghost" style={{ alignSelf:"center" }} onClick={onRefresh} disabled={loading}>
        <Icon name="refresh" size={14} spin={loading} /> به‌روزرسانی
      </button>
    </div>
  );
}

/* ---------- links ---------- */
function LinkRow({ link, onToggle, onDelete, onOpen }) {
  const unlimited = !link.limit_bytes;
  const usedPct = unlimited ? 0 : Math.min(100, (link.used_bytes/link.limit_bytes)*100);
  return (
    <Card className="col gap3" style={{ opacity: link.active ? 1 : .55 }}>
      <div className="row between gap2">
        <button onClick={()=>onOpen(link)} style={{ textAlign:"right", flex:1 }}>
          <div className="row gap2">
            <span className="disp" style={{ fontWeight:700, fontSize:15 }}>{link.label}</span>
            {link.is_default && <span className="badge" style={{ color:"var(--amber)" }}>پیش‌فرض</span>}
            {link.expired && <span className="badge" style={{ color:"var(--red)" }}>منقضی</span>}
          </div>
          <div style={{ fontSize:11.5, color:"var(--muted)", marginTop:2 }}>
            {(PROTOCOLS.find(p=>p.id===link.protocol)||{}).label || link.protocol} · پورت {fa(link.port)}
          </div>
        </button>
        <Toggle checked={link.active} onChange={(v)=>onToggle(link,v)} />
      </div>
      <div>
        <div className="row between" style={{ fontSize:11, color:"var(--muted)", marginBottom:5 }}>
          <span>{fmtBytes(link.used_bytes)} مصرف‌شده</span>
          <span>{unlimited ? "نامحدود" : fmtBytes(link.limit_bytes)}</span>
        </div>
        <div className="progress-track">
          <div className="progress-fill" style={{ width: unlimited?"100%":`${usedPct}%`, background: usedPct>85 && !unlimited ? "var(--red)" : "linear-gradient(90deg,var(--teal),var(--blue))" }} />
        </div>
      </div>
      <div className="row gap2">
        <button onClick={()=>onOpen(link)} className="row center gap2" style={{ flex:1, background:"var(--panel-hi)", color:"var(--blue)", borderRadius:10, padding:"9px", fontSize:12.5 }}>
          <Icon name="qrcode" size={14} /> مشاهده کانفیگ
        </button>
        <button onClick={()=>onDelete(link)} style={{ background:"rgba(240,69,92,.1)", color:"var(--red)", borderRadius:10, padding:"9px 11px" }}>
          <Icon name="trash" size={14} />
        </button>
      </div>
    </Card>
  );
}

function LinksTab({ links, onToggle, onDelete, onOpenDetail, onCreateClick }) {
  return (
    <div className="col gap3" style={{ paddingBottom:16 }}>
      {links.length === 0 && (
        <Card className="col center" style={{ padding:"40px 0", textAlign:"center" }}>
          <Icon name="link" size={26} color="var(--muted)" />
          <p style={{ color:"var(--muted)", fontSize:13, marginTop:10 }}>هنوز کانفیگی نساختی</p>
        </Card>
      )}
      {links.map(l => <LinkRow key={l.uuid} link={l} onToggle={onToggle} onDelete={onDelete} onOpen={onOpenDetail} />)}
      <button className="fab" onClick={onCreateClick}><Icon name="plus" size={24} color="#fff" /></button>
    </div>
  );
}

/* ---------- connections ---------- */
function ConnectionsTab({ connections }) {
  return (
    <div className="col gap3" style={{ paddingBottom:16 }}>
      {connections.length === 0 && (
        <Card className="col center" style={{ padding:"40px 0", textAlign:"center" }}>
          <Icon name="wifi" size={26} color="var(--muted)" />
          <p style={{ color:"var(--muted)", fontSize:13, marginTop:10 }}>در حال حاضر اتصال زنده‌ای نیست</p>
        </Card>
      )}
      {connections.map((c,i) => (
        <Card key={c.ip+i} className="row gap3">
          <div className="row center" style={{ width:40, height:40, borderRadius:12, background:"rgba(33,208,172,.12)", flexShrink:0 }}>
            <Icon name="wifi" size={17} color="var(--teal)" />
          </div>
          <div className="flex1">
            <div dir="ltr" className="mono truncate" style={{ textAlign:"right", fontSize:13 }}>{c.ip}</div>
            <div style={{ fontSize:11.5, color:"var(--muted)", marginTop:2 }}>{c.label} · {fa(c.sessions)} سشن</div>
          </div>
          <div style={{ fontSize:12.5, color:"var(--blue)", fontWeight:600, flexShrink:0 }}>{c.bytes_fmt}</div>
        </Card>
      ))}
    </div>
  );
}

/* ---------- settings ---------- */
function SettingsTab({ onLogout }) {
  return (
    <div className="col gap3" style={{ paddingBottom:16 }}>
      <Card>
        <div style={{ fontSize:12.5, color:"var(--muted)", marginBottom:6 }}>آدرس پنل</div>
        <div dir="ltr" className="mono" style={{ fontSize:12.5, color:"var(--text)" }}>{BASE}</div>
      </Card>
      <button onClick={onLogout} className="row center gap2" style={{ background:"rgba(240,69,92,.1)", color:"var(--red)", fontWeight:600, fontSize:14, borderRadius:14, padding:"13px" }}>
        <Icon name="logout" size={16} /> خروج از حساب
      </button>
    </div>
  );
}

/* ---------- create modal ---------- */
function Field({ label, children, style }) {
  return <div style={style}><div style={{ fontSize:11.5, color:"var(--muted)", marginBottom:6 }}>{label}</div>{children}</div>;
}
function CreateModal({ onClose, onSubmit, busy }) {
  const [label, setLabel] = useState("");
  const [limitValue, setLimitValue] = useState("10");
  const [limitUnit, setLimitUnit] = useState("GB");
  const [expiresDays, setExpiresDays] = useState("30");
  const [protocol, setProtocol] = useState("vless-ws");
  const [fingerprint, setFingerprint] = useState("chrome");
  const [port, setPort] = useState("443");
  const [ipLimit, setIpLimit] = useState("0");

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
        <div className="row between">
          <h3 className="disp" style={{ fontSize:17, fontWeight:700, margin:0 }}>ساخت کانفیگ جدید</h3>
          <button onClick={onClose}><Icon name="x" size={20} color="var(--muted)" /></button>
        </div>
        <Field label="نام کانفیگ"><input className="input" value={label} onChange={e=>setLabel(e.target.value)} placeholder="مثلاً مشتری ۱" /></Field>
        <div className="row gap2">
          <Field label="حجم مجاز" style={{ flex:1 }}><input dir="ltr" className="input" value={limitValue} onChange={e=>setLimitValue(e.target.value)} inputMode="decimal" placeholder="۰ = نامحدود" /></Field>
          <Field label="واحد" style={{ width:90 }}>
            <select className="input" value={limitUnit} onChange={e=>setLimitUnit(e.target.value)}>
              <option value="GB">GB</option><option value="MB">MB</option>
            </select>
          </Field>
        </div>
        <Field label="مدت اعتبار (روز — ۰ نامحدود)"><input dir="ltr" className="input" value={expiresDays} onChange={e=>setExpiresDays(e.target.value)} inputMode="numeric" /></Field>
        <Field label="پروتکل">
          <select className="input" value={protocol} onChange={e=>setProtocol(e.target.value)}>
            {PROTOCOLS.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
        </Field>
        <div className="row gap2">
          <Field label="Fingerprint" style={{ flex:1 }}>
            <select className="input" value={fingerprint} onChange={e=>setFingerprint(e.target.value)}>
              {FINGERPRINTS.map(f => <option key={f} value={f}>{f}</option>)}
            </select>
          </Field>
          <Field label="پورت" style={{ width:90 }}><input dir="ltr" className="input" value={port} onChange={e=>setPort(e.target.value)} inputMode="numeric" /></Field>
        </div>
        <Field label="محدودیت IP هم‌زمان (۰ نامحدود)"><input dir="ltr" className="input" value={ipLimit} onChange={e=>setIpLimit(e.target.value)} inputMode="numeric" /></Field>
        <button className="btn-primary" disabled={busy || !label}
          onClick={()=>onSubmit({ label, limit_value: parseFloat(limitValue)||0, limit_unit: limitUnit, expires_days: parseInt(expiresDays)||0, protocol, fingerprint, port: parseInt(port)||443, ip_limit: parseInt(ipLimit)||0 })}>
          <Icon name={busy?"loader":"plus"} size={18} spin={busy} /> ساخت کانفیگ
        </button>
      </div>
    </div>
  );
}

/* ---------- detail modal ---------- */
function DetailModal({ link, onClose }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    navigator.clipboard?.writeText(link.vless_link).catch(()=>{});
    setCopied(true); setTimeout(()=>setCopied(false), 1600);
  };
  const qr = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(link.vless_link)}`;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet col center" onClick={e=>e.stopPropagation()}>
        <div className="row between" style={{ width:"100%" }}>
          <h3 className="disp" style={{ fontSize:17, fontWeight:700, margin:0 }}>{link.label}</h3>
          <button onClick={onClose}><Icon name="x" size={20} color="var(--muted)" /></button>
        </div>
        <div style={{ background:"#fff", borderRadius:16, padding:12 }}>
          <img src={qr} width={200} height={200} alt="QR" />
        </div>
        <div style={{ width:"100%", background:"var(--panel-hi)", border:"1px solid var(--line)", borderRadius:12, padding:12 }}>
          <p dir="ltr" className="mono" style={{ wordBreak:"break-all", textAlign:"right", fontSize:11, color:"var(--muted)", lineHeight:1.7, margin:0 }}>{link.vless_link}</p>
        </div>
        <button className="btn-primary" style={{ width:"100%", background: copied ? "var(--teal)" : "var(--panel-hi)", color: copied ? "#04241d" : "var(--text)" }} onClick={copy}>
          <Icon name={copied?"check":"copy"} size={18} /> {copied ? "کپی شد" : "کپی لینک کانفیگ"}
        </button>
      </div>
    </div>
  );
}

/* ---------- root ---------- */
function App() {
  const [authed, setAuthed] = useState(false);
  const [checkedAuth, setCheckedAuth] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [stats, setStats] = useState(null);
  const [links, setLinks] = useState([]);
  const [connections, setConnections] = useState([]);
  const [loading, setLoading] = useState(false);
  const [showCreate, setShowCreate] = useState(false);
  const [creating, setCreating] = useState(false);
  const [detailLink, setDetailLink] = useState(null);
  const [toast, showToast] = useToast();

  const loadAll = useCallback(async () => {
    setLoading(true);
    try {
      const [s,l,c] = await Promise.all([apiCall("/stats"), apiCall("/api/links"), apiCall("/api/connections")]);
      setStats(s); setLinks(l.links||[]); setConnections(c.connections||[]);
    } catch (e) {
      if (e.message === "UNAUTHORIZED") setAuthed(false);
      else showToast(e.message, "err");
    } finally { setLoading(false); }
  }, [showToast]);

  useEffect(() => {
    (async () => {
      try { const me = await apiCall("/api/me"); setAuthed(!!me.authenticated); }
      catch { setAuthed(false); }
      finally { setCheckedAuth(true); }
    })();
  }, []);

  useEffect(() => { if (authed) loadAll(); }, [authed]); // eslint-disable-line
  useEffect(() => { if (!authed) return; const t = setInterval(loadAll, 15000); return () => clearInterval(t); }, [authed, loadAll]);

  async function handleToggle(link, active) {
    setLinks(prev => prev.map(l => l.uuid===link.uuid ? {...l, active} : l));
    try {
      await apiCall(`/api/links/${link.uuid}`, { method:"PATCH", body: JSON.stringify({ active }) });
      showToast(active ? "کانفیگ فعال شد" : "کانفیگ غیرفعال شد");
    } catch (e) { showToast(e.message, "err"); loadAll(); }
  }
  async function handleDelete(link) {
    try {
      await apiCall(`/api/links/${link.uuid}`, { method:"DELETE" });
      setLinks(prev => prev.filter(l => l.uuid!==link.uuid));
      showToast("کانفیگ حذف شد");
    } catch (e) { showToast(e.message, "err"); }
  }
  async function handleCreate(form) {
    setCreating(true);
    try {
      const res = await apiCall("/api/links", { method:"POST", body: JSON.stringify(form) });
      setLinks(prev => [res, ...prev]);
      setShowCreate(false); showToast("کانفیگ ساخته شد"); setDetailLink(res);
    } catch (e) { showToast(e.message, "err"); }
    finally { setCreating(false); }
  }
  async function handleLogout() {
    try { await apiCall("/api/logout", { method:"POST" }); } catch {}
    setAuthed(false);
  }

  if (!checkedAuth) {
    return <div className="row center" style={{ width:"100%", height:"100%" }}><Icon name="loader" size={26} color="var(--blue)" spin /></div>;
  }
  if (!authed) return <LoginScreen onLoggedIn={()=>setAuthed(true)} />;

  const TABS = [
    { id:"dashboard", label:"داشبورد", icon:"dashboard" },
    { id:"links", label:"کانفیگ‌ها", icon:"link" },
    { id:"connections", label:"اتصالات", icon:"radio" },
    { id:"settings", label:"تنظیمات", icon:"settings" },
  ];

  return (
    <div className="col" style={{ width:"100%", height:"100%" }}>
      <div className="row between" style={{ padding:"20px 20px 12px", flexShrink:0 }}>
        <div className="row gap2">
          <div className="row center" style={{ width:32, height:32, borderRadius:9, background:"linear-gradient(135deg,var(--blue),var(--violet))" }}>
            <Icon name="shield" size={16} color="#fff" />
          </div>
          <span className="disp" style={{ fontWeight:700, fontSize:16 }}>X4G Companion</span>
        </div>
        <button onClick={loadAll}><Icon name="refresh" size={16} color="var(--muted)" spin={loading} /></button>
      </div>

      <div className="flex1" key={tab} style={{ overflowY:"auto", padding:"0 20px", animation:"fade .3s ease both" }}>
        {tab==="dashboard" && <DashboardTab stats={stats} links={links} loading={loading} onRefresh={loadAll} />}
        {tab==="links" && <LinksTab links={links} onToggle={handleToggle} onDelete={handleDelete} onOpenDetail={setDetailLink} onCreateClick={()=>setShowCreate(true)} />}
        {tab==="connections" && <ConnectionsTab connections={connections} />}
        {tab==="settings" && <SettingsTab onLogout={handleLogout} />}
      </div>

      <div className="tab-bar">
        {TABS.map(t => (
          <button key={t.id} className={`tab-item ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>
            <Icon name={t.icon} size={19} /><span>{t.label}</span>
          </button>
        ))}
      </div>

      {showCreate && <CreateModal onClose={()=>setShowCreate(false)} onSubmit={handleCreate} busy={creating} />}
      {detailLink && <DetailModal link={detailLink} onClose={()=>setDetailLink(null)} />}
      {toast && (
        <div className="toast" style={{ background: toast.kind==="err" ? "var(--red)" : "var(--panel-hi)", color: toast.kind==="err" ? "#fff" : "var(--text)" }}>
          <Icon name={toast.kind==="err"?"alert":"check"} size={14} color={toast.kind==="err"?"#fff":"var(--teal)"} /> {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
